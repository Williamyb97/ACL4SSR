; ========== 自定义代理组 ==========
custom_proxy_group=🚀 出口节点`select`[]♻️ 延迟优选`.*
custom_proxy_group=🌐 未知流量`select`[]🏠 国内直连`[]🚀 出口节点
custom_proxy_group=🤖 ChatGPT`select`(GPT|ChatGPT|OpenAI|openai|chatgpt)`[]🚀 出口节点
custom_proxy_group=💠 Gemini`select`(Gemini|gemini|Google AI|google ai)`[]🚀 出口节点
;custom_proxy_group=🚫 广告过滤`select`[]🏠 国内直连`[]REJECT
custom_proxy_group=🧠 智能专区`select`[]🤖 ChatGPT`[]💠 Gemini`[]🚀 出口节点
custom_proxy_group=🏠 国内直连`select`[]DIRECT
custom_proxy_group=♻️ 延迟优选`url-test`.*`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
